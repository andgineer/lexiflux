[pytest]
DJANGO_SETTINGS_MODULE = tests.django_settings

; log_cli = true
;log_cli_level = DEBUG
markers =
    docker: requires docker
    selenium: uses Selenium
    playwright: Playwright browser tests (headless; --headed to watch)
    real_llm: calls the real free LLM pool; runs only with LEXIFLUX_REAL_LLM=1
